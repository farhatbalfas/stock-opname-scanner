
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Login Stock Opname 3PL</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      max-width: calc(100% - 60px);
      text-align: center;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #263238;
    }

    #googleButton {
      display: flex;
      justify-content: center;
      margin-top: 25px;
    }

    #status {
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h2>Stock Opname 3PL</h2>

    <p>Silakan login menggunakan akun Google yang terdaftar.</p>

    <div id="googleButton"></div>

    <div id="status"></div>
  </div>

  <script>
    const GOOGLE_CLIENT_ID =
      "966268303906-ctqr3ivkmpmk86f2cuhbv09k4djtv6gm.apps.googleusercontent.com";

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbyNGnDNsdATUeCC-Tf5kBd4M20oU_hZhioSmb3Rjyfqe2_Xg0r8Q-xRoD2JUw5CRYp3/exec";


    /**************************************************
     * INISIALISASI GOOGLE LOGIN
     **************************************************/

    function initGoogleLogin() {

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse
      });

      google.accounts.id.renderButton(
        document.getElementById("googleButton"),
        {
          theme: "outline",
          size: "large",
          text: "signin_with",
          shape: "rectangular",
          width: 280
        }
      );
    }


    /**************************************************
     * SETELAH LOGIN GOOGLE BERHASIL
     **************************************************/

    function handleCredentialResponse(response) {

      if (!response || !response.credential) {
        document.getElementById("status").textContent =
          "Login Google gagal. Silakan coba kembali.";
        return;
      }

      document.getElementById("googleButton").style.display = "none";

      document.getElementById("status").textContent =
        "Login Google berhasil. Sedang memverifikasi hak akses...";

      // Kirim token menggunakan POST.
      // Token tidak dimasukkan ke URL.
      const form = document.createElement("form");

      form.method = "POST";
      form.action = URL_APPS_SCRIPT;
      form.style.display = "none";

      const input = document.createElement("input");

      input.type = "hidden";
      input.name = "id_token";
      input.value = response.credential;

      form.appendChild(input);

      document.body.appendChild(form);

      form.submit();
    }

  </script>

  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer
    onload="initGoogleLogin()">
  </script>

</body>
</html>
