
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Login Stock Opname Provider NFI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #F1F3F0 0%, #E9F0EA 52%, #F2F4F1 100%);
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #263238;
    }

    .login-box {
      background: rgba(255,255,255,0.96);
      padding: 34px 28px;
      border-radius: 18px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h2 {
      margin: 0 0 18px;
      color: #263238;
      font-size: 25px;
      line-height: 1.3;
    }

    .instruction {
      margin: 0;
      font-size: 17px;
      line-height: 1.6;
      color: #4b5563;
    }

    #googleButton {
      display: flex;
      justify-content: center;
      margin-top: 28px;
      min-height: 44px;
    }

    #status {
      margin-top: 20px;
      font-size: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
      }

      .login-box {
        max-width: 100%;
        padding: 34px 22px;
        border-radius: 16px;
      }

      h2 {
        font-size: 27px;
      }

      .instruction {
        font-size: 18px;
        line-height: 1.6;
      }

      #status {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h2>Stock Opname Provider NFI</h2>

    <p class="instruction">
      Silakan login menggunakan akun Google yang terdaftar.
    </p>

    <div id="googleButton"></div>

    <div id="status"></div>
  </div>

  <script>
    const GOOGLE_CLIENT_ID =
      "966268303906-ctqr3ivkmpmk86f2cuhbv09k4djtv6gm.apps.googleusercontent.com";

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbyNGnDNsdATUeCC-Tf5kBd4M20oU_hZhioSmb3Rjyfqe2_Xg0r8Q-xRoD2JUw5CRYp3/exec";


    /**************************************************
     * INISIALISASI GOOGLE LOGIN
     **************************************************/

    function initGoogleLogin() {

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse
      });

      google.accounts.id.renderButton(
        document.getElementById("googleButton"),
        {
          theme: "outline",
          size: "large",
          text: "signin_with",
          shape: "rectangular",
          width: 280
        }
      );
    }


    /**************************************************
     * SETELAH LOGIN GOOGLE BERHASIL
     **************************************************/

    function handleCredentialResponse(response) {

      if (!response || !response.credential) {
        document.getElementById("status").textContent =
          "Login Google gagal. Silakan coba kembali.";
        return;
      }

      document.getElementById("googleButton").style.display = "none";

      document.getElementById("status").textContent =
        "Login Google berhasil. Sedang memverifikasi hak akses...";

      const form = document.createElement("form");

      form.method = "POST";
      form.action = URL_APPS_SCRIPT;
      form.style.display = "none";

      const input = document.createElement("input");

      input.type = "hidden";
      input.name = "id_token";
      input.value = response.credential;

      form.appendChild(input);

      document.body.appendChild(form);

      form.submit();
    }

  </script>

  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer
    onload="initGoogleLogin()">
  </script>

</body>
</html>
