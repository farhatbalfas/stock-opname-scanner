
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Stock Opname 3PL</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      max-width: calc(100% - 60px);
      text-align: center;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #263238;
    }

    #googleButton {
      display: flex;
      justify-content: center;
      margin-top: 25px;
    }

    #status {
      margin-top: 20px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h2>Stock Opname 3PL</h2>
    <p>Silakan login menggunakan akun Google.</p>

    <div id="googleButton"></div>

    <div id="status"></div>
  </div>

  <script>
    function initGoogleLogin() {
      google.accounts.id.initialize({
        client_id: "966268303906-ctqr3ivkmpmk86f2cuhbv09k4djtv6gm.apps.googleusercontent.com",
        callback: handleCredentialResponse
      });

      google.accounts.id.renderButton(
        document.getElementById("googleButton"),
        {
          theme: "outline",
          size: "large",
          text: "signin_with",
          shape: "rectangular",
          width: 280
        }
      );
    }

    function handleCredentialResponse(response) {
      try {
        const bagian = response.credential.split(".")[1];
        const base64 = bagian
          .replace(/-/g, "+")
          .replace(/_/g, "/");

        const payload = JSON.parse(atob(base64));

        document.getElementById("status").innerHTML =
          "Google berhasil mengenali akun:<br><br><b>" +
          payload.email +
          "</b><br><br>Status: Tes login berhasil";

      } catch (error) {
        document.getElementById("status").textContent =
          "Gagal membaca respons Google.";
      }
    }
  </script>

  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer
    onload="initGoogleLogin()">
  </script>

</body>
</html>
